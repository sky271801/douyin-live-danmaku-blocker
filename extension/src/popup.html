<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>抖音直播弹幕屏蔽助手</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <header class="header">
      <div class="brand">
        <span class="logo">🛡️</span>
        <div>
          <div class="title">抖音直播弹幕屏蔽</div>
          <div class="subtitle" id="roomLabel">检测当前标签页...</div>
        </div>
      </div>
      <label class="switch" title="总开关">
        <input type="checkbox" id="masterToggle" checked />
        <span class="slider"></span>
      </label>
    </header>

    <section class="stats">
      <div class="stat">
        <div class="stat-num accent" id="statBlocked">-</div>
        <div class="stat-label">本页已屏蔽</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="statRules">0</div>
        <div class="stat-label">生效规则</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="statRooms">0</div>
        <div class="stat-label">已配直播间</div>
      </div>
    </section>

    <section class="card">
      <div class="card-title">快速添加屏蔽词</div>
      <div class="add-row">
        <input type="text" id="quickInput" placeholder="输入刷屏弹幕关键词..." />
        <select id="quickType">
          <option value="contains">包含</option>
          <option value="exact">精确</option>
          <option value="regex">正则</option>
          <option value="user">用户</option>
        </select>
      </div>
      <div class="btn-row">
        <button id="addRoomBtn" class="btn btn-primary" disabled>屏蔽本直播间</button>
        <button id="addGlobalBtn" class="btn">全局屏蔽</button>
      </div>
      <div class="msg" id="statusMsg"></div>
    </section>

    <section class="card">
      <div class="toggle-row">
        <span>开启智能重复弹幕折叠</span>
        <label class="switch">
          <input type="checkbox" id="antiSpamToggle" checked />
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span>屏蔽视频画面飘屏弹幕</span>
        <label class="switch">
          <input type="checkbox" id="videoToggle" checked />
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span>屏蔽右侧公屏聊天消息</span>
        <label class="switch">
          <input type="checkbox" id="chatToggle" checked />
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <footer class="footer">
      <button id="openPanelBtn" class="btn btn-full" disabled>在直播页面打开完整面板 (Alt+B)</button>
    </footer>
  </div>

  <script src="filter-engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
